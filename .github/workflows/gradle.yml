
name: Build Arclight FeudalKings

on:
  workflow_dispatch:
  push:
    branches:
      - FeudalKings

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Arclight
        run: |
          chmod +x gradlew
          ./gradlew cleanBuild build collect --no-daemon --stacktrace

      - name: Upload server JARs
        uses: actions/upload-artifact@v4
        with:
          name: Arclight-FeudalKings
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
