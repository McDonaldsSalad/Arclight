name: Build NeoForge 26.1.2

on:
  push:
    branches:
      - mc-26.1.2-neoforge
  pull_request:
    branches:
      - mc-26.1.2-neoforge
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neoforge-26.1.2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-neoforge:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out Arclight sources
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build NeoForge server JAR
        run: ./gradlew cleanBuild :bootstrap:neoforgeJar --no-daemon --stacktrace

      - name: Upload NeoForge server JAR
        uses: actions/upload-artifact@v4
        with:
          name: arclight-neoforge-26.1.2.126
          path: bootstrap/build/libs/arclight-neoforge-26.1.2-*.jar
          if-no-files-found: error
          retention-days: 14
